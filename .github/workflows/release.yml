name: Release SDK

# Manual only. Publishing to npm cannot be undone after 72 hours, so this never
# fires off a tag or a merge by itself.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag'
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - latest
      dry_run:
        description: 'Pack only, do not publish'
        required: false
        default: true
        type: boolean

jobs:
  publish:
    name: Publish @flagraft/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @flagraft/sdk typecheck
      - run: pnpm --filter @flagraft/sdk test
      - run: pnpm --filter @flagraft/sdk build

      # A prerelease version must not go out as `latest`, and a stable one must
      # not go out as `alpha`. Cheaper to fail here than to fix it on npm.
      - name: Check the version matches the dist-tag
        run: |
          VERSION=$(node -p "require('./packages/sdk-js/package.json').version")
          echo "version=$VERSION tag=${{ inputs.tag }}"
          case "$VERSION:${{ inputs.tag }}" in
            *-*:alpha|*-*:next) ;;
            *-*:latest) echo "::error::$VERSION is a prerelease; refusing to tag it latest"; exit 1 ;;
            *:alpha) echo "::error::$VERSION is stable; publish it as latest"; exit 1 ;;
          esac

      - name: Publish
        working-directory: packages/sdk-js
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --tag "${{ inputs.tag }}" --provenance --access public
          else
            npm publish --tag "${{ inputs.tag }}" --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
