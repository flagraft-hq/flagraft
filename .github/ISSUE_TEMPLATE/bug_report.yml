name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything security related, do not file an issue —
        see [SECURITY.md](../../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a flag with ...
        2. Call GET /api/v1/client/features with ...
        3. Response is ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha.0, or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Server / API
        - Admin UI
        - SDK (@flagraft/sdk)
        - Import / export
        - Docker or deployment
        - Not sure
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, Postgres version, how you run it, and whether a reverse proxy is in front.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output around the failure. Redact keys and connection strings.
      render: shell
